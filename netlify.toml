[build]
  publish = "site"

[[redirects]]
  from = "/api/*"
  to = "https://uxbzfirtxpwpbhlsusmf.supabase.co/functions/v1/exam-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://uxbzfirtxpwpbhlsusmf.supabase.co; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/app/"
    Cache-Control = "no-cache"
